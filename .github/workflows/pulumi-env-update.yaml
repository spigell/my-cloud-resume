name: Update an environment via pulumi
on:
  push:
    branches:
      - production
      - dev
    paths:
      - 'infra/**'
      - 'frontend/**'
      - '.github/**'
  workflow_dispatch:

defaults:
  run:
    shell: bash
    working-directory: infra

jobs:
  preview:
    name: Preview
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v3
      - uses: benjlevesque/short-sha@v2.2
        id: short-sha
        with:
          length: 6
      - id: 'auth'
        uses: 'google-github-actions/auth@v1'
        with:
          credentials_json: '${{ secrets.GKE_DEPLOYER_CREDENTIALS }}'
      - id: 'get-credentials'
        uses: 'google-github-actions/get-gke-credentials@v1'
        with:
          cluster_name: 'main'
          location: 'us-central1-c'
      - name: Setup Node LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: yarn install
      - name: Install pulumi cli
        uses: pulumi/actions@v4
        with:
          pulumi-version: 3.142.0
      - name: Wait for builds
        uses: lewagon/wait-on-check-action@v1.3.1
        with:
          ref: ${{ github.ref }}
          check-name: "Build and save html and pdf"
          repo-token: ${{ github.token }}
          wait-interval: 10
      - name: Download artifact
        id: download-artifact
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: all-build-site-and-pdf.yaml
          workflow_conclusion: success
      - name: Copy pdf to frontend
        run: mv -v ../build-artifacts-*/*.pdf ../frontend
      - name: Run pulumi preview via automation API
        run: npx ts-node ./automations.ts
        env:
          DRY_RUN: true
          STACK_NAME: ${{ github.ref_name }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
  up:
    needs:
      - preview
    name: Deploy
    environment:
      name: ${{ github.ref_name }}
      url: ${{ steps.get-env-url.outputs.url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: benjlevesque/short-sha@v2.2
        id: short-sha
        with:
          length: 6
      - id: 'auth'
        uses: 'google-github-actions/auth@v1'
        with:
          credentials_json: '${{ secrets.GKE_DEPLOYER_CREDENTIALS }}'
      - id: 'get-credentials'
        uses: 'google-github-actions/get-gke-credentials@v1'
        with:
          cluster_name: 'main'
          location: 'us-central1-c'
      - name: Setup Node LTS
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Installing dependencies
        run: yarn install
      - name: Install pulumi cli
        uses: pulumi/actions@v4
      - name: Wait for builds
        uses: lewagon/wait-on-check-action@v1.3.1
        with:
          ref: ${{ github.ref }}
          check-name: "Build and save html and pdf"
          repo-token: ${{ github.token }}
          wait-interval: 10
      - name: Download artifact
        id: download-artifact
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: all-build-site-and-pdf.yaml
          workflow_conclusion: success
      - name: Copy pdf to frontend
        run: mv -v ../build-artifacts-*/*.pdf ../frontend
      - name: Run pulumi update via automation API
        run: npx ts-node ./automations.ts
        env:
          STACK_NAME: ${{ github.ref_name }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      - name: Get env url from pulumi output
        id: get-env-url
        run: echo URL=$(pulumi stack output url -s ${{ github.ref_name }}) >> $GITHUB_OUTPUT
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
