name: Build html and pdf
on:
  push:

defaults:
  run:
    shell: bash
    working-directory: resume

jobs:
  build:
    name: Build and save html and pdf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: benjlevesque/short-sha@v2.2
        id: short-sha
        with:
          length: 6
      - run: make build
      - uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ steps.short-sha.outputs.sha }}
          path: |
            resume/*.pdf
